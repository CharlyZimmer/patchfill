[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "patchfill"
version = "0.1.0"
description = "Patch-based dataset building and gap filling for Earth System Data Cubes"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "xarray",
  "dask",
  "zarr>=3",
  "fsspec",
  "h5py",
  "torch",
  "einops",
  "tqdm",
  "matplotlib",
  "cmocean",
  "geopandas",
  "regionmask",
  "global-land-mask",
]

[project.optional-dependencies]
# Only needed for patchfill.model_training
keras = ["tensorflow"]

[tool.setuptools]
packages = ["patchfill"]
